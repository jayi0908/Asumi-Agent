# asumi-fallback bundle layer
#
# Inserts the model-availability plugin. It works on the `agent/request`
# waterfall: an attempt whose route is a self-hosted one (it carries a
# `baseURL`) that is not answering is sent to the deployment default instead —
# including the retry of the very attempt that failed, so the turn survives.
#
# No provider is named here on purpose: which routes exist, and which one is the
# default, is the user's settings document, not the app's knowledge.
- insert:
    - id: asumi-fallback
      name: asumi-plugin-fallback
      config:
        probeIntervalMs: 30000
        probeTimeoutMs: 2000
