<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="initial-scale=1, width=device-width" />
    <title>Asumi Agent</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
      }

      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1em;
        background: #1a1a2e;
        color: #ececf1;
        font-family:
          -apple-system, "PingFang SC", "Hiragino Sans", system-ui, sans-serif;
      }

      .spinner {
        width: 32px;
        height: 32px;
        border: 3px solid #555;
        border-top-color: #8b5cf6;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .hint {
        font-size: 12px;
        opacity: 0.6;
      }
    </style>
  </head>
  <body>
    <div class="spinner"></div>
    <div>Asumi Agent 正在启动…</div>
    <div class="hint">等待 DSH 引擎就绪</div>
  </body>
</html>
