<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Asumi</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
        font-family: -apple-system, "PingFang SC", system-ui, sans-serif;
        /* The window is click-through unless the user turns that off. */
        user-select: none;
        -webkit-user-select: none;
      }

      .stage {
        position: relative;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        align-items: center;
        /* Both modules animate through these; the module picks which one. */
        opacity: 1;
        transform: none;
        transition:
          opacity 0.42s ease,
          transform 0.44s cubic-bezier(0.22, 0.9, 0.3, 1.16);
        will-change: opacity, transform;
      }

      /* ── presence × appearance ─────────────────────────────────────────
         常駐 always: always in view, the module is irrelevant.
         透明 ghost : hidden until she speaks, arriving by the module.
         隐藏 hidden: the shell takes the window off screen. */

      body[data-presence="always"] .stage {
        opacity: 1;
        transform: none;
      }

      body[data-presence="ghost"][data-appearance="fade"] .stage {
        opacity: 0;
      }

      body[data-presence="ghost"][data-appearance="fade"].asumi-active .stage {
        opacity: 1;
      }

      /* 右下角探头: she leans up from below the corner. */
      body[data-presence="ghost"][data-appearance="peek-bottom"] .stage {
        transform: translateY(100%);
      }

      body[data-presence="ghost"][data-appearance="peek-bottom"].asumi-active .stage {
        transform: translateY(0);
      }

      body[data-presence="hidden"] .stage {
        opacity: 0;
      }

      /* 字幕容器。撑满整个窗口（留一圈边距），文字贴底排布，超出就靠缩字号消化，
         不裁切。 */
      .caption {
        position: absolute;
        left: 0;
        right: 0;
        top: 6px;
        bottom: 6px;
        /* 立绘带 transform（漂浮）与 filter，会自成层叠上下文，而且在文档里更靠后，
           不加这个就会被画在字幕上面。 */
        z-index: 2;
        display: flex;
        align-items: flex-end;
        overflow: hidden;
        pointer-events: none;
      }

      /* 字幕本体：白字 + 深色描边，不画气泡（参考 MurasamePet 的呈现）。
         描边用八向 text-shadow，这是所有 WebKit 版本都认的做法。 */
      .lines {
        width: 100%;
        padding: 0 12px;
        text-align: center;
        font-weight: 700;
        font-size: 13px;
        line-height: 1.5;
        color: #fff;
        word-break: break-word;
        text-shadow:
          -1.5px -1.5px 0 #2c161c,
          1.5px -1.5px 0 #2c161c,
          -1.5px 1.5px 0 #2c161c,
          1.5px 1.5px 0 #2c161c,
          -1.5px 0 0 #2c161c,
          1.5px 0 0 #2c161c,
          0 -1.5px 0 #2c161c,
          0 1.5px 0 #2c161c,
          0 2px 4px rgba(0, 0, 0, 0.4);
        opacity: 0;
        transform: translateY(4px);
        transition:
          opacity 0.18s ease,
          transform 0.18s ease;
      }

      .caption.show .lines {
        opacity: 1;
        transform: none;
      }

      /* 中文一行、日语一行，各自流式浮出。 */
      .line {
        display: block;
      }

      /* ── 形态：SD 贴纸 / 游戏立绘（只露上半身）─────────────────────────
         立绘的拼接在脚本里做（canvas 按 pos 叠身体与表情），这里只负责显示：
         源图已经裁到上半，再让它盖满窗口。 */
      body[data-form="sd"] .tachie {
        display: none;
      }

      body[data-form="tachie"] .asumi {
        display: none;
      }

      /* 立绘直接画进 canvas（不导出图片），所以跨源加载的图层也不会因
         canvas 被污染而出错；画面已在脚本里按「盖满窗口、只取上半」算好。 */
      .tachie {
        width: 100%;
        height: 100%;
        display: block;
      }

      .asumi {
        width: 100%;
        max-height: 340px;
        object-fit: contain;
        object-position: bottom;
        animation: float 3.4s ease-in-out infinite;
        filter: drop-shadow(0 8px 18px rgba(0, 0, 0, 0.28));
        transition: transform 0.25s ease;
      }

      @keyframes float {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-5px);
        }
      }

      /* Emotion states nudge the pose; art swap can replace these later. */
      body[data-state="happy"] .asumi {
        transform: translateY(-3px) scale(1.02);
      }
      body[data-state="excited"] .asumi {
        animation-duration: 1.6s;
      }
      body[data-state="shy"] .asumi {
        transform: translateY(2px) scale(0.99);
        filter: drop-shadow(0 6px 14px rgba(255, 150, 180, 0.35));
      }
      body[data-state="thinking"] .asumi {
        animation-duration: 5s;
      }
    </style>
  </head>
  <body data-state="neutral" data-presence="always" data-appearance="fade" data-form="sd">
    <div class="stage">
      <div class="caption" id="caption"><div class="lines" id="lines"></div></div>
      <canvas class="tachie" id="tachie"></canvas>
      <img class="asumi" id="asumi" src="./asumi.png" alt="Asumi" />
    </div>
    <script>
      const caption = document.getElementById('caption')
      const linesEl = document.getElementById('lines')
      const tachie = document.getElementById('tachie')

      // 说完之后还留多久（壳侧的「开口，停留后收回」）。
      const DWELL_MS = 4000
      // 一直收不到「说完了」信号时的兜底，避免字幕永久停住。
      const SAFETY_MS = 180000
      // 一行字幕逐字浮现的基础节奏；长的那行按这个速度走，短的那行放慢，
      // 让中/日两行同时开始、同时结束。
      const MS_PER_CHAR = 80
      const MAX_FONT = 15
      const MIN_FONT = 13

      let presence = 'always'
      let appearance = 'fade'
      let hideTimer = null
      let streams = []

      // 壳侧切换存在方式时调用。
      window.__asumiSetPresence = (next) => {
        presence = next || 'always'
        document.body.dataset.presence = presence
        if (presence !== 'ghost') withdraw()
      }

      // 壳侧切换出现模组时调用。
      window.__asumiSetAppearance = (next) => {
        appearance = next || 'fade'
        document.body.dataset.appearance = appearance
      }

      // 表情 → 差分 id（立绘换脸）与 SD 贴纸的姿势桶（沿用原有 CSS 的那几个）。
      const EMOTIONS = {
        default: { face: '0004', pose: 'neutral' },
        doubt: { face: '0002', pose: 'thinking' },
        serious: { face: '0003', pose: 'thinking' },
        helpless: { face: '0005', pose: 'shy' },
        confident: { face: '0006', pose: 'happy' },
        reproach: { face: '0007', pose: 'thinking' },
        surprised: { face: '0008', pose: 'excited' },
        glad: { face: '0013', pose: 'happy' },
        pout: { face: '0017', pose: 'shy' },
        sad: { face: '0018', pose: 'shy' },
        sigh: { face: '0028', pose: 'thinking' },
        relieved: { face: '0031', pose: 'happy' },
        angry: { face: '0033', pose: 'excited' },
        agitated: { face: '0036', pose: 'excited' },
        stunned: { face: '0040', pose: 'excited' },
        grin: { face: '0041', pose: 'happy' },
        embarrassed: { face: '0046', pose: 'shy' },
        cry: { face: '0047', pose: 'shy' },
        disgust: { face: '0050', pose: 'thinking' },
        excited: { face: '0051', pose: 'excited' }
      }

      let emotion = 'default'

      // 壳侧切换情绪时调用。
      window.__asumiSetState = (state) => {
        emotion = state && EMOTIONS[state] ? state : 'default'
        document.body.dataset.state = EMOTIONS[emotion].pose
        // 只换表情，身体保持不变。
        if (form === 'tachie') refreshSprite(false)
      }

      function scheduleHide(ms) {
        if (hideTimer) clearTimeout(hideTimer)
        hideTimer = setTimeout(withdraw, ms)
      }

      function stopStreams() {
        for (const stream of streams) {
          if (stream.timer) clearInterval(stream.timer)
        }
        streams = []
      }

      function withdraw() {
        if (hideTimer) {
          clearTimeout(hideTimer)
          hideTimer = null
        }
        stopStreams()
        document.body.classList.remove('asumi-active')
        caption.classList.remove('show')
      }

      // 只现身、不说话时（例如换情绪）也能看到人：停留一个 dwell 后收回。
      window.__asumiReveal = () => {
        if (presence !== 'ghost') return
        document.body.classList.add('asumi-active')
        scheduleHide(DWELL_MS)
      }

      // 说完了：把还没打出的字一次补全，然后开始停留计时。
      window.__asumiSpeechDone = () => {
        for (const stream of streams) {
          if (stream.timer) {
            clearInterval(stream.timer)
            stream.timer = null
          }
          stream.node.textContent = stream.glyphs.join('')
        }
        scheduleHide(DWELL_MS)
      }

      // 壳侧收到台词时调用。台词是「中文一行 + 日语一行」（换行分隔）：中文与日语
      // 同时流式浮现，各自按长度配速，最后一起打完。字幕立刻出现，但要一直留到
      // 语音结束（壳侧随后会再发 __asumiSpeechDone）：合成可能要好几秒，固定计时
      // 会在出声前就把字幕收掉。
      window.__asumiSay = (text) => {
        if (!text) return
        const lines = text
          .split('\n')
          .map((line) => line.trim())
          .filter((line) => line !== '')
        if (lines.length === 0) return

        stopStreams()
        fitFont(lines)
        linesEl.replaceChildren()
        for (const line of lines) {
          const node = document.createElement('div')
          node.className = 'line'
          linesEl.append(node)
          streams.push({ node, glyphs: Array.from(line), timer: null })
        }

        const longest = streams.reduce((most, stream) => Math.max(most, stream.glyphs.length), 1)
        const total = longest * MS_PER_CHAR
        for (const stream of streams) {
          const count = stream.glyphs.length
          if (count === 0) continue
          // 短的一行拿到更大的间隔，于是两行在同一时刻收尾。
          const interval = Math.max(total / count, 10)
          let shown = 0
          stream.timer = setInterval(() => {
            shown += 1
            stream.node.textContent = stream.glyphs.slice(0, shown).join('')
            if (shown >= count) {
              clearInterval(stream.timer)
              stream.timer = null
            }
          }, interval)
        }

        if (presence === 'ghost') document.body.classList.add('asumi-active')
        caption.classList.add('show')
        scheduleHide(SAFETY_MS)
      }

      // 用整段文字预排版，逐级缩字号直到装得下，保证长台词不被裁掉。
      function fitFont(lines) {
        linesEl.style.fontSize = MAX_FONT + 'px'
        linesEl.replaceChildren()
        for (const line of lines) {
          const node = document.createElement('div')
          node.className = 'line'
          node.textContent = line
          linesEl.append(node)
        }
        let size = MAX_FONT
        while (size > MIN_FONT && linesEl.getBoundingClientRect().height > caption.clientHeight) {
          size -= 0.5
          linesEl.style.fontSize = size + 'px'
        }
        // 流式阶段会重建空节点。
        linesEl.replaceChildren()
      }

      // ── 形态与立绘 ─────────────────────────────────────────────────────
      let form = 'sd'
      let sprite = null
      let currentBody = null
      let composeBusy = false
      let composeAgain = false
      let composeRepick = false

      window.__asumiSetForm = (next) => {
        form = next === 'tachie' ? 'tachie' : 'sd'
        if (form === 'sd') {
          document.body.dataset.form = 'sd'
          return
        }
        refreshSprite(true)
      }

      window.__asumiSetSpriteConfig = (config) => {
        sprite = config || null
        if (form === 'tachie') refreshSprite(true)
      }

      // 壳侧在每次开口前调用：随机模式下换一具身体。
      window.__asumiRefreshSprite = () => {
        if (form === 'tachie') refreshSprite(true)
      }

      // 设置里的「测试立绘」：换一张，并露一次（无视存在方式）。
      window.__asumiPreviewSprite = () => {
        if (form !== 'tachie') return
        refreshSprite(true)
        document.body.classList.add('asumi-active')
        scheduleHide(DWELL_MS)
      }

      function pickBody(pack) {
        if (sprite.mode === 'fixed') {
          return pack.bodies.find((body) => body.id === sprite.body) || pack.bodies[0]
        }
        let pool = pack.bodies
        if (sprite.mode === 'subset') {
          const chosen = new Set(sprite.bodies || [])
          const subset = pack.bodies.filter((body) => chosen.has(body.id))
          if (subset.length > 0) pool = subset
        }
        return pool[Math.floor(Math.random() * pool.length)]
      }

      function pickFace(pack, body) {
        const wanted = body.group + (EMOTIONS[emotion] ? EMOTIONS[emotion].face : '0004')
        return (
          pack.faces.find((face) => face.id === wanted) ||
          pack.faces.find((face) => face.id === body.group + '0004') ||
          pack.faces.find((face) => face.group === body.group) ||
          null
        )
      }

      function layerUrl(name) {
        const root = String((sprite.catalog && sprite.catalog.root) || '').replace(/\/+$/, '')
        return window.asumi.convertFileSrc(root + '/' + sprite.pack + '/' + name + '.png')
      }

      function loadImage(url) {
        return new Promise((resolve, reject) => {
          const image = new Image()
          image.onload = () => resolve(image)
          image.onerror = reject
          image.src = url
        })
      }

      // 把身体与表情按 pos 叠好，再按「盖满窗口、只取上半身」画进 canvas。
      // 图层来自 asset://（与应用不同源），所以只绘制、不导出像素。
      async function drawBust(canvas, pack, body, face) {
        const rects = face ? [body, face] : [body]
        const minX = Math.min(...rects.map((rect) => rect.x))
        const minY = Math.min(...rects.map((rect) => rect.y))
        const maxX = Math.max(...rects.map((rect) => rect.x + rect.w))
        const maxY = Math.max(...rects.map((rect) => rect.y + rect.h))
        const full = document.createElement('canvas')
        full.width = Math.max(1, maxX - minX)
        full.height = Math.max(1, maxY - minY)
        const fullContext = full.getContext('2d')
        const bodyImage = await loadImage(layerUrl(body.id))
        fullContext.drawImage(bodyImage, body.x - minX, body.y - minY, body.w, body.h)
        if (face) {
          const faceImage = await loadImage(layerUrl(face.id))
          fullContext.drawImage(faceImage, face.x - minX, face.y - minY, face.w, face.h)
        }

        const ratio = window.devicePixelRatio || 1
        const width = canvas.clientWidth || 360
        const height = canvas.clientHeight || 420
        canvas.width = Math.max(1, Math.round(width * ratio))
        canvas.height = Math.max(1, Math.round(height * ratio))
        const context = canvas.getContext('2d')
        context.clearRect(0, 0, canvas.width, canvas.height)
        context.imageSmoothingQuality = 'high'

        const cropHeight = Math.max(1, Math.round(full.height / 2))
        const scale = Math.max(canvas.width / full.width, canvas.height / cropHeight)
        const drawWidth = full.width * scale
        const drawHeight = cropHeight * scale
        context.drawImage(
          full,
          0,
          0,
          full.width,
          cropHeight,
          (canvas.width - drawWidth) / 2,
          0,
          drawWidth,
          drawHeight
        )
      }

      // repick = true 换一具身体（每次开口 / 切换设置）；false 只换表情。
      function refreshSprite(repick) {
        const pack =
          sprite && sprite.catalog && sprite.catalog.packs && sprite.catalog.packs[sprite.pack]
        if (!pack || !pack.bodies || pack.bodies.length === 0) {
          // No usable art: wear the sticker rather than stand there invisible.
          document.body.dataset.form = 'sd'
          return
        }
        document.body.dataset.form = 'tachie'
        if (composeBusy) {
          // 合成中：记下最新意图，画完再补一次。
          composeAgain = true
          composeRepick = composeRepick || repick
          return
        }
        if (repick || !currentBody) currentBody = pickBody(pack)
        if (!currentBody) return
        composeBusy = true
        drawBust(tachie, pack, currentBody, pickFace(pack, currentBody))
          .catch(() => {})
          .finally(() => {
            composeBusy = false
            if (composeAgain) {
              composeAgain = false
              const again = composeRepick
              composeRepick = false
              refreshSprite(again)
            }
          })
      }

      // 采纳壳侧在本脚本之前注入的状态。放在最后很重要：上面是赋值，不是
      // 会被提升的函数声明。
      const init = window.__ASUMI_INIT || {}
      window.__asumiSetPresence(init.presence || presence)
      window.__asumiSetAppearance(init.appearance || appearance)
      window.__asumiSetSpriteConfig(init.sprite || null)
      window.__asumiSetForm((init.sprite && init.sprite.form) || 'sd')
    </script>
  </body>
</html>
