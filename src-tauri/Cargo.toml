[package]
name = "asumi-agent"
version = "0.1.0"
description = "Asumi Agent desktop shell: a Tauri host for the DeepSeek Harness engine"
authors = ["jayi0908"]
edition = "2021"

[lib]
name = "asumi_agent_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "macos-private-api", "tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
serde_json = "1"
