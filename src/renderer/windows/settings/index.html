<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="initial-scale=1, width=device-width" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src blob: *; script-src 'self' 'unsafe-eval' 'unsafe-inline' *; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' *; font-src 'self' data: *; img-src 'self' data: file: * blob:; media-src 'self' file:; frame-src * file:" />
    <title>Cherry Studio Settings</title>
    <style>html, body { margin: 0; }</style>
  </head>
  <body>
    <div id="root"></div>
    <div id="spinner"><img src="/assets/images/logo.png" /></div>
    <script>
      window.__CHERRY_HTTP_PORT = 38887
      fetch('/assets/cherry-backend-port.json?t=' + Date.now())
        .then(r => r.json()).then(p => { if (p.httpPort) window.__CHERRY_HTTP_PORT = p.httpPort }).catch(() => {})
    </script>
    <script type="module" src="/windows/settings/entryPoint.tsx"></script>
  </body>
</html>
