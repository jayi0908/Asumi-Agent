name: Build (macOS)

on:
  push:
    branches: ["main", "feat/dsh-engine"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Each architecture builds on its own runner. The harness installs
          # native addons (koffi, node-pty) compiled for the machine, so an
          # arm64 runner cannot produce the x86_64 engine.
          - runner: macos-14
            target: aarch64-apple-darwin
          - runner: macos-13
            target: x86_64-apple-darwin
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Must match NODE_VERSION in scripts/fetch-node.mjs: the bundled
      # interpreter has to share an ABI with the addons pnpm built here.
      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.11.1

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          shared-key: ${{ matrix.target }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The bundle overlay carries the engine and the Node sidecar; the engine
      # install is the slow part, so it is cached between runs.
      - name: Cache engine tree
        uses: actions/cache@v4
        with:
          path: src-tauri/engine
          key: engine-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package.json', 'asumi-plugins/**') }}

      - name: Build with Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_INCREMENTAL: 0
        with:
          args: --target ${{ matrix.target }} --config src-tauri/tauri.bundle.conf.json
          tauriScript: pnpm tauri

      - name: Upload app bundle
        uses: actions/upload-artifact@v7
        with:
          name: AsumiAgent-${{ matrix.target }}-app
          path: src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app
          if-no-files-found: warn
